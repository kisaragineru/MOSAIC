# Netlify (test/staging deployment). Secrets are set in the Netlify UI/API, never here.
# Migrations and the catalog seed run on Netlify's build machine with MIGRATION_DATABASE_URL,
# which must be scoped to "Builds" only so the owner credential never reaches the functions.
[build]
  command = "pnpm db:migrate && pnpm db:seed && pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.28.0"

# The old address goes to the site's own domain (paths and query kept). Branch and preview
# deploys have their own hosts and are not affected.
[[redirects]]
  from = "https://mosaic-test-3008fa.netlify.app/*"
  to = "https://mosaicdiary.app/:splat"
  status = 301
  force = true

# The app's own pictures (not hashed, rarely changed): kept a day, refreshed in the background.
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/tuvi-types/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
